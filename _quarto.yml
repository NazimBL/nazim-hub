# _quarto.yml
project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - research.qmd
    - about.qmd
    - projects.qmd
    - blog/index.qmd
    - blog/**/*.qmd
    - posts/*.qmd
    - wearable-hydration

website:
  title: "nazim-hub.com"
  description: "I am a versatile Research Engineer/Scientist with a solid background in electronics, embedded systems, and software/hardware integration. My work focuses on applying AI and biosensing to develop scalable wearable health monitoring systems. I am always exploring innovative ways to translate technological advances into meaningful healthcare impact."
  site-url: "https://nazimbl.github.io/nazim-hub"
  repo-url: "https://github.com/NazimBL/nazim-hub"

  
  search: true

  navbar:
    right:
      - text: "About"
        href: about.qmd
      - text: "Research"
        href: research.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "Blog"
        href: blog/index.qmd

  page-footer:
    center:
      - text: "<a href='cv/nazim_hub_resume_202511.pdf' target='_blank'>CV</a>
               &nbsp;<a href='https://github.com/NazimBL' target='_blank'><i class='bi bi-github'></i></a>
               &nbsp;<a href='https://www.linkedin.com/in/nazim-a-belabbaci/' target='_blank'><i class='bi bi-linkedin'></i></a>
               &nbsp;<a href='https://scholar.google.com/citations?view_op=list_works&hl=en&user=f7QBAtEAAAAJ' target='_blank'><i class='ai ai-google-scholar fa-lg'></i></a>
               &nbsp;<a href='https://www.researchgate.net/profile/Nazim-Belabbaci' target='_blank'><i class='ai ai-researchgate fa-lg'></i></a>
               &nbsp;<a href='https://orcid.org/0009-0006-8380-9818' target='_blank'><i class='ai ai-orcid fa-lg'></i></a>
               <br>Site made with <i class='bi bi-heart-fill'></i>,
               <a href='https://github.com/NazimBL/nazim-hub' target='_blank'><i class='bi bi-git'></i></a>,
               and <a href='https://quarto.org/' target='_blank'><img src='https://quarto.org/favicon.png' width=12> quarto</a>
               <br>© 2025 Nazim Ahmed Belabbaci"

format:
  html:
    theme: [default, css/theme.scss]
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    # This is to include fontawesome and academic icons in the headers:
    include-in-header: "_includes/header.html"


execute:
  freeze: auto

collections:
  posts:
    categories: true
    feed: true
    sort: "date desc"

resources:
    - "content/"
    - "css"
    - "splitkbcompare.html"
    - "static/"
    - cv/
